
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chelavie Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10111a;color:#eee;font-family:Arial,sans-serif;padding:20px}
.container{max-width:850px;margin:45px auto}
.card{background:#1b1c29;border:1px solid #303144;border-radius:16px;padding:24px;margin-bottom:18px}
h1{color:#c7a5ff;margin:0 0 8px}
.sub{color:#999;font-size:14px}
input{width:100%;padding:14px;border-radius:9px;border:1px solid #414258;background:#11121c;color:white;margin:9px 0 15px}
button{padding:12px 17px;border:0;border-radius:9px;background:#9362db;color:white;font-weight:bold;cursor:pointer}
button:hover{opacity:.85}
.danger{background:#b74761}
.secondary{background:#35364a}
.row{display:flex;gap:10px;align-items:center}
.row input{flex:1;min-width:0}
.stats{font-size:30px;font-weight:bold;color:#c7a5ff}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #303144}
.item span{overflow-wrap:anywhere}
.hidden{display:none}
#message{color:#c7a5ff;margin:12px 0}
@media(max-width:480px){body{padding:12px}.container{margin:20px auto}.card{padding:17px}.item{align-items:flex-start}.item button{padding:9px}}
</style>
</head>
<body>
<div class="container">

<div class="card">
<h1>✦ Chelavie Panel</h1>
<div class="sub">Access Control Management</div>
</div>

<div id="login" class="card">
<h2>Admin Login</h2>
<form id="loginForm">
<label>Email</label>
<input id="email" type="email" placeholder="Email admin" required>
<label>Password</label>
<input id="password" type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<div id="loginMessage"></div>
</div>

<div id="dashboard" class="hidden">
<div class="card">
<div class="row" style="justify-content:space-between">
<h2>Dashboard</h2>
<button id="logout" class="secondary">Logout</button>
</div>
<div class="sub">Total nomor whitelist</div>
<div class="stats" id="total">0</div>
</div>

<div class="card">
<h3>Tambah Nomor</h3>
<form id="addForm">
<input id="phone" placeholder="Contoh: 6281234567890" required>
<button type="submit">+ Tambah Nomor</button>
</form>
<div id="addMessage"></div>
</div>

<div class="card">
<h3>Daftar Whitelist</h3>
<input id="search" placeholder="Cari nomor...">
<div id="numbers">Memuat data...</div>
</div>
</div>
</div>

<script>
const SUPABASE_URL = "https://djouuqmfqgazvvhbmwda.supabase.co";
const SUPABASE_KEY = "sb_publishable_lcIlTOGg38UiWqCmLPW7Ig_HpgQJD_d";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const loginBox=document.getElementById("login");
const dashboard=document.getElementById("dashboard");
const numbersBox=document.getElementById("numbers");
const totalBox=document.getElementById("total");

function message(id,text){
 document.getElementById(id).textContent=text;
}

function showDashboard(show){
 loginBox.classList.toggle("hidden",show);
 dashboard.classList.toggle("hidden",!show);
}

async function loadNumbers(){
 numbersBox.textContent="Memuat data...";
 const {data,error}=await db.from("whitelist_numbers")
 .select("id,phone,created_at").order("created_at",{ascending:false});

 if(error){
  numbersBox.textContent="Gagal memuat: "+error.message;
  return;
 }

 totalBox.textContent=data.length;
 const query=document.getElementById("search").value.trim().toLowerCase();
 const filtered=data.filter(x=>x.phone.toLowerCase().includes(query));

 numbersBox.replaceChildren();

 if(!filtered.length){
  numbersBox.textContent="Belum ada nomor.";
  return;
 }

 filtered.forEach(item=>{
  const row=document.createElement("div");
  row.className="item";

  const phone=document.createElement("span");
  phone.textContent=item.phone;

  const del=document.createElement("button");
  del.className="danger";
  del.textContent="Hapus";
  del.onclick=()=>deleteNumber(item.id,item.phone);

  row.append(phone,del);
  numbersBox.append(row);
 });
}

async function deleteNumber(id,phone){
 if(!confirm("Hapus nomor "+phone+"?"))return;

 const {error}=await db.from("whitelist_numbers").delete().eq("id",id);

 if(error){
  alert("Gagal menghapus: "+error.message);
  return;
 }
 loadNumbers();
}

document.getElementById("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 message("loginMessage","Memeriksa akun...");

 const {error}=await db.auth.signInWithPassword({
  email:document.getElementById("email").value,
  password:document.getElementById("password").value
 });

 if(error){
  message("loginMessage","Login gagal: "+error.message);
 }else{
  message("loginMessage","");
  showDashboard(true);
  loadNumbers();
 }
});

document.getElementById("addForm").addEventListener("submit",async e=>{
 e.preventDefault();

 const phone=document.getElementById("phone").value.replace(/\D/g,"");

 if(!/^\d{10,15}$/.test(phone)){
  message("addMessage","Nomor harus berisi 10-15 digit.");
  return;
 }

 const {error}=await db.from("whitelist_numbers").insert({phone});

 if(error){
  message("addMessage","Gagal: "+error.message);
 }else{
  message("addMessage","Nomor berhasil ditambahkan!");
  document.getElementById("phone").value="";
  loadNumbers();
 }
});

document.getElementById("search").addEventListener("input",loadNumbers);

document.getElementById("logout").addEventListener("click",async()=>{
 await db.auth.signOut();
 showDashboard(false);
});

db.auth.getSession().then(({data})=>{
 if(data.session){
  showDashboard(true);
  loadNumbers();
 }
});

db.auth.onAuthStateChange((event,session)=>{
 if(event==="SIGNED_OUT")showDashboard(false);
 if(event==="SIGNED_IN"){
  showDashboard(true);
  loadNumbers();
 }
});
</script>
</body>
</html>
